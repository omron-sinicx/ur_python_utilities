# Parameters for ur_control.grippers.GripperController (client node).
# Example:
#   ros2 run ur_control_examples joint_position_keyboard --gripper generic \
#     --ros-args --params-file $(ros2 pkg prefix ur_gripper_gz)/share/ur_gripper_gz/config/gripper_hande_client.yaml
/**:
  ros__parameters:
    gripper_type: hand-e
    joint: finger_joint
    joints:
      - finger_joint
      - hande_right_finger_joint
    # gz-sim: gripper_controller is a JointTrajectoryController (not GripperAction).
    gripper_action_interface: trajectory
    gripper_trajectory_controller: gripper_controller
    # gz over-close jam workaround: cap per-finger travel (gz_ros2_control ignores
    # URDF limits). 0.02 m verified safe; raise toward 0.025 if your model allows.
    gripper_finger_max_position: 0.02
